name: Deploy

# Publica o jogo na Roblox a cada push na main que mexa no jogo (ou manualmente).
# Precisa do secret ROBLOX_API_KEY (veja a seção "CI/CD" do README). Sem o secret, o workflow
# só valida e gera o place, e avisa que NÃO publicou.
#
# ATENÇÃO: o repositório é a fonte da verdade. A publicação SUBSTITUI o conteúdo do place pelo
# que o Rojo gera; edições feitas só dentro do Studio e nunca commitadas são perdidas.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "default.project.json"
      - "wally.toml"
      - "wally.lock"
      - "rokit.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      restart_servers:
        description: "Reiniciar os servidores depois de publicar (expulsa quem está jogando)"
        type: boolean
        default: false

permissions:
  contents: read

# nunca dois deploys ao mesmo tempo, e um deploy em andamento não é cancelado no meio
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  UNIVERSE_ID: "10775759574"
  PLACE_ID: "127475605109985"

jobs:
  deploy:
    name: Validar, buildar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Formatação e lint
        run: |
          stylua --check src tests
          selene src

      - name: Teste do Config
        # IDs zerados (item ainda não criado na Roblox) viram AVISO: a loja mostra "Em breve" e
        # nunca chama a compra desse item. Para exigir todos os IDs, use REQUIRE_IDS=1.
        run: |
          lune run tests/config-check | tee config-check.txt
          if grep -q "id = 0" config-check.txt; then
            echo "::warning::Há produtos/passes com id = 0 no Config (aparecem como Em breve na loja). Veja o log deste passo."
          fi

      - name: Instalar pacotes (Wally)
        run: wally install

      - name: Build do place (Rojo)
        run: |
          mkdir -p build
          rojo build -o build/steal-a-boo.rbxl
          ls -la build

      - name: Guardar o place gerado
        uses: actions/upload-artifact@v4
        with:
          name: steal-a-boo-place
          path: build/steal-a-boo.rbxl
          retention-days: 30

      - name: Publicar na Roblox (Open Cloud)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ]; then
            echo "::warning::Secret ROBLOX_API_KEY não configurado: o place foi gerado e validado, mas NÃO foi publicado."
            exit 0
          fi
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build/steal-a-boo.rbxl)
          echo "Publicado: ${response}"
          echo "### Publicado na Roblox" >> "$GITHUB_STEP_SUMMARY"
          echo "Versão do place: \`${response}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Reiniciar servidores (opcional)
        if: ${{ inputs.restart_servers == true || vars.RESTART_SERVERS == 'true' }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ]; then exit 0; fi
          curl --silent --show-error --fail-with-body \
            --request POST \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}:restartServers" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}'
          echo "Servidores reiniciados."
