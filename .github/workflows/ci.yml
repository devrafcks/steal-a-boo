name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Formatação (StyLua)
        run: stylua --check src tests

      - name: Lint (Selene)
        run: selene src

      - name: Teste do Config (Lune)
        run: lune run tests/config-check

      - name: Simulação de balanceamento (100h)
        run: node tools/balance/sim.js 100

      - name: Instalar pacotes (Wally)
        run: wally install

      - name: Build do place (Rojo)
        run: |
          mkdir -p build
          rojo build -o build/steal-a-boo.rbxl

      - name: Guardar o place gerado
        uses: actions/upload-artifact@v4
        with:
          name: steal-a-boo-place
          path: build/steal-a-boo.rbxl
          retention-days: 14
