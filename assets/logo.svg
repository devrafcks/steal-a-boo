<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t">
  <title id="t">Steal a Boo! logo</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1650"/>
      <stop offset="1" stop-color="#5a2f8f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ac8"/>
      <stop offset="0.5" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#5ad8ff"/>
    </linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe6f3"/>
      <stop offset="1" stop-color="#ff9fd2"/>
    </radialGradient>
  </defs>
  <rect width="640" height="320" rx="36" fill="url(#sky)"/>
  <!-- lua e estrelas -->
  <circle cx="560" cy="64" r="30" fill="#fff4b8"/>
  <circle cx="574" cy="54" r="26" fill="#3a1f68"/>
  <g fill="#fff" opacity="0.85">
    <circle cx="70" cy="50" r="3"/><circle cx="140" cy="28" r="2"/><circle cx="470" cy="34" r="2.5"/>
    <circle cx="610" cy="140" r="2"/><circle cx="36" cy="150" r="2"/><circle cx="420" cy="80" r="1.8"/>
  </g>
  <!-- lampiões -->
  <g>
    <line x1="0" y1="18" x2="640" y2="40" stroke="#ffd84a" stroke-width="2" opacity="0.6"/>
    <circle cx="90" cy="24" r="7" fill="#ffd84a"/><circle cx="220" cy="28" r="7" fill="#ff7ac8"/>
    <circle cx="350" cy="32" r="7" fill="#5ad8ff"/><circle cx="480" cy="36" r="7" fill="#ffd84a"/>
  </g>
  <!-- Boo mascote -->
  <g transform="translate(150 190)">
    <ellipse cx="0" cy="92" rx="70" ry="12" fill="#1a0b33" opacity="0.5"/>
    <ellipse cx="0" cy="10" rx="88" ry="80" fill="url(#body)" stroke="#2a1650" stroke-width="6"/>
    <circle cx="-14" cy="-80" r="10" fill="#ffd84a" stroke="#2a1650" stroke-width="4"/>
    <path d="M -14 -70 Q -10 -60 -4 -66" stroke="#2a1650" stroke-width="4" fill="none"/>
    <ellipse cx="-30" cy="0" rx="20" ry="24" fill="#fff" stroke="#2a1650" stroke-width="4"/>
    <ellipse cx="30" cy="0" rx="20" ry="24" fill="#fff" stroke="#2a1650" stroke-width="4"/>
    <ellipse cx="-26" cy="6" rx="10" ry="12" fill="#2a1650"/>
    <ellipse cx="34" cy="6" rx="10" ry="12" fill="#2a1650"/>
    <circle cx="-22" cy="0" r="4" fill="#fff"/><circle cx="38" cy="0" r="4" fill="#fff"/>
    <ellipse cx="-58" cy="32" rx="14" ry="8" fill="#ff6fa8" opacity="0.8"/>
    <ellipse cx="58" cy="32" rx="14" ry="8" fill="#ff6fa8" opacity="0.8"/>
    <ellipse cx="2" cy="44" rx="12" ry="10" fill="#5a1838"/>
  </g>
  <!-- título -->
  <g font-family="'Luckiest Guy','Fredoka One','Arial Black',sans-serif" font-weight="900" text-anchor="middle">
    <text x="430" y="170" font-size="74" fill="#2a1650" stroke="#2a1650" stroke-width="14" stroke-linejoin="round">STEAL</text>
    <text x="430" y="170" font-size="74" fill="url(#title)">STEAL</text>
    <text x="430" y="252" font-size="74" fill="#2a1650" stroke="#2a1650" stroke-width="14" stroke-linejoin="round">A BOO!</text>
    <text x="430" y="252" font-size="74" fill="url(#title)">A BOO!</text>
  </g>
</svg>
